name: Publish production and PR previews
on:
  workflow_run:
    workflows: [Website CI and GitHub Pages]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
# Pending events can coalesce; the publisher reconciles all current PR heads.
concurrency:
  group: combined-github-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Only trusted main code runs with write permissions. PR artifacts are data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile checked production and preview builds
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/pages-preview.py prepare
          --state "$RUNNER_TEMP/pages-state"
          --incoming "$RUNNER_TEMP/incoming-site"
          --plan "$RUNNER_TEMP/preview-plan.json"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.prepare.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/pages-state/site
          include-hidden-files: true
      - name: Deploy production and previews together
        id: deployment
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Add or update PR preview links after deployment
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: >-
          python3 scripts/pages-preview.py report
          --state "$RUNNER_TEMP/pages-state"
          --incoming "$RUNNER_TEMP/incoming-site"
          --plan "$RUNNER_TEMP/preview-plan.json"
