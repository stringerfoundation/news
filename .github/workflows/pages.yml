name: Website CI and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: Syntax, lint, types and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:relay
      - run: pnpm run test:previews
  security:
    name: Workflow lint and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned workflow and secret scanners
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Validate workflow syntax and shell commands
        run: '"$(go env GOPATH)/bin/actionlint" -color'
      - name: Scan Git history for credentials
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1'
  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=high
      - name: Review dependency changes on pull requests
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
  browser-tests:
    name: Browser regressions (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep this version aligned with @playwright/test in package.json.
    # Browsers and OS dependencies are preinstalled; no apt install on each run.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: reader
            command: node --import tsx --test tests/browser.spec.ts tests/previews.browser.ts tests/smoke.browser.ts
          - suite: editions
            command: node --import tsx --test tests/portuguese.browser.ts tests/multilingual.browser.ts
          - suite: relay
            command: pnpm run test:relay-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Allow Git access to the mounted checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD
      - name: Select screenshots for frontend PR changes
        if: matrix.suite == 'reader'
        id: screenshots
        run: python3 scripts/screenshot-scope.py
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run browser suite
        run: ${{ matrix.command }}
      - name: Upload preview screenshots
        if: matrix.suite == 'reader' && steps.screenshots.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-screenshots
          path: .test-output/news-*.png
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
  browser:
    # Preserve the existing required check and publish only after every suite passes.
    name: Public build, artifact and browser regressions
    needs: browser-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all browser suites to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: test "$BROWSER_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Collect Kiswahili headlines for publication
        run: >-
          node --input-type=module -e
          "import { embedSwahiliHeadlines } from './scripts/collect-swahili.ts';
          import { fetchText } from './scripts/collect.ts';
          await embedSwahiliHeadlines('_site/sw/index.html', fetchText);"
      - name: Collect Atomstr headlines for same-origin fallback
        run: >-
          node --input-type=module -e
          "import { embedAtomstrHeadlines } from './scripts/collect-atomstr.ts';
          import { readAtomstrSources } from './relay/atomstr-reader.ts';
          await embedAtomstrHeadlines('_site', sources => readAtomstrSources({sources, previous: {}}));"
      - name: Embed Courageous Stories in the reader pages
        run: >-
          node --input-type=module -e
          "import { embedStringerStories } from './scripts/collect-stringer.ts';
          import { fetchText } from './scripts/collect.ts';
          await embedStringerStories('_site', fetchText);"
      - run: pnpm run test:artifact
      - name: Package checked site
        run: tar -cf "$RUNNER_TEMP/public-site.tar" -C _site .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-site
          path: ${{ runner.temp }}/public-site.tar
          retention-days: 30
          if-no-files-found: error
  codeql:
    name: CodeQL security analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:${{ matrix.language }}
