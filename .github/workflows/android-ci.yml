name: Android CI
on:
  pull_request:
    paths:
      - 'android/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradle.properties'
      - 'scripts/android-*.sh'
      - 'scripts/generate-android-catalogue.ts'
      - 'zapstore.yaml'
      - 'docs/android-releases.md'
      - '.github/workflows/android-*.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - 'locales/**'
      - 'sources/**'
      - 'relay/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradle.properties'
      - 'scripts/android-*.sh'
      - 'scripts/generate-android-catalogue.ts'
      - 'zapstore.yaml'
      - 'docs/android-releases.md'
      - '.github/workflows/android-*.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - 'locales/**'
      - 'sources/**'
      - 'relay/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  catalogue:
    name: Verify generated Android catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/generate-android-catalogue.ts --check

  checks:
    name: Android unit tests, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run unit tests, lint, and build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  emulator-smoke:
    name: Install and launch debug APK on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM for the Android emulator
        run: sudo chmod 777 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash scripts/android-emulator-smoke.sh
