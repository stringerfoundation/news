name: Deploy News to Cloudflare Pages
on:
  workflow_run:
    workflows: [Website CI and GitHub Pages]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  cloudflare-pages:
    name: Deploy checked site to Cloudflare Pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    environment: cloudflare-pages
    env:
      CHECKED_RUN_ID: ${{ github.event.workflow_run.id }}
      CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download and validate this run's checked artifact
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import os
          import runpy
          from pathlib import Path

          publisher = runpy.run_path('scripts/pages-preview.py')
          api = publisher['GitHub'](os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'])
          artifacts = api.items(f"actions/runs/{os.environ['CHECKED_RUN_ID']}/artifacts")
          checked = [item for item in artifacts if item['name'] == publisher['ARTIFACT'] and not item['expired']]
          if len(checked) != 1 or checked[0]['size_in_bytes'] > publisher['MAX_BYTES']:
              raise ValueError('Expected one downloadable checked site artifact within the size limit')

          destination = Path(os.environ['RUNNER_TEMP']) / 'cloudflare-site'
          publisher['unpack'](api.request(f"actions/artifacts/{checked[0]['id']}/zip", binary=True), destination)
          current = api.request('git/ref/heads/main')['object']['sha'] == os.environ['CHECKED_SHA']
          if not current:
              print('A newer commit is on main. Skipping this deployment.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"current={str(current).lower()}\n")
          PY
      - name: Upload checked assets to Cloudflare Pages
        if: steps.prepare.outputs.current == 'true'
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the account ID in the cloudflare-pages environment}"
          : "${CLOUDFLARE_API_TOKEN:?Set the API token in the cloudflare-pages environment}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Set the project name in the cloudflare-pages environment}"
          pnpm dlx wrangler@4.136.3 pages deploy "$RUNNER_TEMP/cloudflare-site" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$CHECKED_SHA"
