name: PR coverage report
on:
  workflow_run:
    workflows: [Frontend coverage]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
concurrency:
  group: coverage-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  report:
    name: Update PR coverage indicator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run uses trusted default-branch code. No PR code is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 -B scripts/report-coverage.py
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_RUN_ID: ${{ github.event.workflow_run.id }}
